name: CI

# Builds and tests GNUSketch on Linux and Windows on every push and pull request.
# A tag v* also packages both (AppImage, Windows zip) and publishes a release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build zlib1g-dev \
            qt6-base-dev qt6-base-dev-tools qt6-declarative-dev libqt6opengl6-dev libqt6svg6-dev \
            qt6-image-formats-plugins qt6-wayland libqt6svg6 \
            libgl1-mesa-dev libegl1-mesa-dev mesa-utils xvfb xauth file

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: UI self-test (Xvfb, software GL)
        run: tools/headless-selftest.sh build

      - name: AppImage
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          QMAKE: /usr/lib/qt6/bin/qmake
          EXTRA_QT_MODULES: svg
          EXTRA_PLATFORM_PLUGINS: libqwayland-egl.so;libqwayland-generic.so
        run: |
          DESTDIR=$PWD/AppDir cmake --install build
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          export VERSION=${GITHUB_REF_NAME#v}
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --desktop-file packaging/gnusketch.desktop --icon-file packaging/gnusketch.svg \
            --plugin qt --output appimage
          mv GNUSketch-*.AppImage GNUSketch-${VERSION}-x86_64.AppImage
          ./GNUSketch-${VERSION}-x86_64.AppImage --version

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: linux
          path: GNUSketch-*.AppImage

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-imageformats
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-mesa

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: UI self-test (Mesa software OpenGL)
        env:
          GALLIUM_DRIVER: llvmpipe
          QT_OPENGL: software
        run: |
          # Qt's software OpenGL: Mesa (llvmpipe) as opengl32sw.dll beside the
          # program. Only for the test; the package uses the system's driver.
          pacman -Ql mingw-w64-ucrt-x86_64-mesa | grep -i '\.dll$' || true
          cp /ucrt64/bin/opengl32.dll build/opengl32sw.dll
          for d in /ucrt64/bin/libgallium_wgl.dll /ucrt64/bin/libglapi.dll; do [ -f "$d" ] && cp "$d" build/; done
          ./build/gnusketch.exe --gl-probe
          ./build/gnusketch.exe --selftest
          rm -f build/opengl32sw.dll build/libgallium_wgl.dll build/libglapi.dll

      - name: Package
        run: |
          VERSION=$(sed -n 's/^project(GNUSketch VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          [[ "$GITHUB_REF_NAME" == v* ]] && VERSION=${GITHUB_REF_NAME#v}
          DIST=dist/GNUSketch-${VERSION}-windows-x64
          cmake --install build --prefix "$DIST"
          windeployqt6 --release --no-translations --compiler-runtime "$DIST/bin/gnusketch.exe" || \
            windeployqt-qt6 --release --no-translations --compiler-runtime "$DIST/bin/gnusketch.exe"
          # Every MinGW/MSYS2 DLL the program and its libraries need, until nothing new turns up.
          for pass in 1 2 3 4 5; do
            find "$DIST" -iname '*.exe' -o -iname '*.dll' | while read f; do
              ldd "$f" 2>/dev/null | awk '/\/ucrt64\// {print $3}'
            done | sort -u | while read d; do cp -n "$d" "$DIST/bin/" 2>/dev/null || true; done
          done
          cp README.md DOCUMENTATION.md LICENSE "$DIST/"
          (cd dist && zip -qr "GNUSketch-${VERSION}-windows-x64.zip" "GNUSketch-${VERSION}-windows-x64")
          ls -la dist
          "$DIST/bin/gnusketch.exe" --version

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/*/* \
            --title "GNUSketch ${GITHUB_REF_NAME#v}" \
            --notes-file packaging/release-notes.md --prerelease
